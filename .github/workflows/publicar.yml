# Publicación del sitio de Vendoo en GitHub Pages.
#
# Dos trabajos y en este orden: primero se verifica, y sólo si pasa se publica.
# Un sitio con un enlace roto o una página que no cierra sus etiquetas no llega
# a producción.
#
# No hace falta ningún secreto: GitHub Pages se despliega con el token del
# propio workflow (`pages: write` + `id-token: write`). Lo único que hay que
# hacer una vez en el repositorio es Settings › Pages › Source: «GitHub
# Actions», y cargar el dominio en «Custom domain». Está en el README.

name: Publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación por rama a la vez, y la que está en curso NO se cancela:
# `actions/deploy-pages` a medio camino deja el sitio en un estado que
# GitHub no promete, y esperar un minuto es más barato que averiguarlo.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Que estén las cuatro páginas
        run: |
          faltan=0
          for f in index.html contacto.html terminos.html privacidad.html; do
            if [ ! -f "$f" ]; then echo "falta $f"; faltan=1; fi
          done
          exit $faltan

      # HTML bien formado, metadatos mínimos, enlaces internos y anclas,
      # y que no haya ni un recurso externo. Sin dependencias: solo Python.
      - name: Chequeo del HTML y de los enlaces
        run: python3 tool/verificar.py

      # Segunda opinión, con una herramienta de verdad. Es informativa: tidy
      # se queja de cosas que no son errores, así que no tumba la publicación.
      - name: Segunda opinión con tidy (informativa)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tidy
          for f in *.html; do
            echo "--- $f"
            tidy -quiet -errors --gnu-emacs yes "$f" || true
          done

      # Se sube una carpeta armada a mano y no el repositorio entero: así
      # `tool/`, `.github/` y el README no terminan servidos como parte del
      # sitio. Es copiar archivos, no compilar nada. El CNAME es lo que le
      # dice a Pages qué dominio sirve.
      - name: Armar la carpeta que se publica
        run: |
          mkdir -p _sitio
          cp -R assets _sitio/
          cp *.html robots.txt sitemap.xml favicon.svg site.webmanifest CNAME _sitio/
          # Sin Jekyll: Pages lo correría por defecto y se comería cualquier
          # archivo o carpeta que empiece con guion bajo. Y los README de
          # assets/ son del repositorio, no del sitio.
          touch _sitio/.nojekyll
          find _sitio -name 'README.md' -delete
          ls -laR _sitio | head -80
          # Lo que NO tiene que viajar: `_headers` (Pages lo ignora y se
          # serviría como un archivo más), `tool/` y `.github/`.
          for f in _headers tool .github README.md; do
            if [ -e "_sitio/$f" ]; then echo "$f no va en el sitio"; exit 1; fi
          done

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    name: Publicar en GitHub Pages
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deploy
        uses: actions/deploy-pages@v4
