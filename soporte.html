<!-- /soporte.html — UN DESVÍO, NO UNA PÁGINA (12-sep-2026).

     Por qué existe. `contacto.html` es la Support URL de la ficha de App Store
     y ahí vive ahora el bloque #soporte. Pero `/soporte.html` es la dirección
     que cualquiera adivina —un revisor de Apple, un vendedor al que le
     dictaron «entrá a vendooapp punto com barra soporte», un borrador viejo de
     la ficha— y hasta hoy contestaba 404. Se buscó en el sitio entero y en el
     repositorio de la aplicación: NO HAY UN SOLO ENLACE a esta dirección, o
     sea que no había nada roto que arreglar. Esto es un seguro, y por eso es
     un desvío de veinte líneas y no una segunda página de soporte: dos páginas
     de soporte se contradicen en el primer dato que alguien cambie en una sola.

     Por qué no se hizo al revés (apuntar los enlaces a contacto.html): no hay
     enlaces que apuntar. Y por qué no se dejó en el 404: el 404 le dice al
     visitante que se equivocó, y acá no se equivocó — la página que buscaba
     existe, sólo que con otro nombre.

     Fuera del sitemap y con `noindex`: no es contenido y no compite en
     buscadores con la página de verdad. Está en el `Disallow` de robots.txt
     por lo mismo que 404.html.

     Lleva la analítica como las cinco páginas de verdad —`tool/verificar.py` la
     exige en todas—, y de paso cuenta si alguien llega de verdad por acá: si
     en seis meses no entró nadie, este archivo se borra. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-al+j7D2AC+Lg/qYigLZDlWHZklNovSDisZNbFWp86bo=' https://www.gstatic.com https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://firebase.googleapis.com https://firebaseinstallations.googleapis.com; base-uri 'none'; form-action 'none'">

<!-- El desvío. GitHub Pages no sabe hacer un 301 —lo único que puede servir

     el dueño aplique las reglas de Cloudflare que el README tiene
     pendientes, la 301 de verdad va ahí y este archivo se puede borrar. -->

<script>/* Dos cosas que tienen que pasar ANTES del primer pintado.

   1. El tema elegido: con `defer` la pagina parpadearia en claro. Los tres
      valores estan explicados en sitio.js.
   2. `data-js`, que dice que SI hay JavaScript. De ahi cuelga el menu
      plegable del telefono: sin esa marca el menu se ve entero, como antes.
      Va aca porque el menu se pinta plegado, y puesta con `defer` se verian
      los seis enlaces un instante antes de plegarse.
   3. `data-anim`, que es lo que habilita las animaciones de entrada. Va aca
      y no en sitio.js por lo mismo: puesto despues, lo que va a aparecer se
      veria un instante antes de esconderse. Y se QUITA SOLO a los dos
      segundos si sitio.js no alcanzo a marcar `data-listo` — sin esa red,
      un script que no cargue dejaria media pagina en opacity 0. */
try{var t=localStorage.getItem('vendoo-tema');
if(t==='claro'||t==='oscuro'){document.documentElement.setAttribute('data-tema',t);}}catch(e){}
try{var h=document.documentElement;h.setAttribute('data-js','1');h.setAttribute('data-anim','1');
setTimeout(function(){if(!h.hasAttribute('data-listo')){h.removeAttribute('data-anim');}},2000);}catch(e){}</script>
<script src="/assets/js/sitio.js" defer></script>
